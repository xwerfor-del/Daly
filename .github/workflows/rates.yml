
name: تحديث سعر الليرة

on:
  schedule:
    - cron: '*/30 6-16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: جلب الأسعار
        run: node update-rates.mjs
        env:
          SPTODAY_API_KEY: ${{ secrets.SPTODAY_API_KEY }}
      - name: حفظ الأسعار
        run: |
          git config user.name "daly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "تحديث سعر الصرف" && git push)
